:root{--burg:#790015;--wine:#600012;--rose:#9d4e60;--ink:#35282c;--muted:#8f7b81;--border:#ecdde1;--bg:#f8f5f6;--white:#fff;--shadow:0 14px 48px #3b09231c}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a55472;outline-offset:2px}button:disabled{cursor:default;opacity:.5}
.shell{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:0 12px 36px}.app{width:min(100%,520px);min-height:100dvh;background:#fff;box-shadow:var(--shadow);position:relative}.app::before{content:"";height:4px;background:var(--burg);position:absolute;top:0;left:0;right:0;z-index:30}#screen{min-height:100dvh}.ny-acad{background:#fff;color:var(--ink);min-height:100dvh;padding-bottom:38px}.ny-nav{height:64px;position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:grid;grid-template-columns:52px 1fr 52px;align-items:center;text-align:center;padding-top:4px}.ny-nav strong{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}.ny-nav button{background:none;border:0;color:var(--burg);font-size:28px;height:52px;min-width:48px;line-height:1}.ny-nav .empty{display:block}.ny-acad-top{text-align:center;padding:43px 18px 23px}.ny-acad-top img{width:116px;height:116px;object-fit:contain}.ny-acad-top h2{font-size:21px;letter-spacing:.65px;margin:17px 0 7px;color:var(--burg)}.ny-acad-top small,.ny-acard>small,.ny-acad-title small,.system-label{font-size:10px;letter-spacing:1.4px;color:#a17583;font-weight:650}.ny-acard{border:1px solid var(--border);border-radius:14px;background:white;margin:16px;padding:20px;color:#503c43}.ny-acard h3{font-size:16px;line-height:1.55;margin:16px 0 12px;color:var(--wine)}.ny-acard p{font-size:12.5px;line-height:1.95;margin:12px 0 18px;color:#65545b;white-space:pre-line;overflow-wrap:anywhere}.ny-acad-actions{display:flex;flex-direction:column;gap:13px;margin-top:30px}.ny-acad-actions button,.ny-acard form button,.solid{min-height:48px;width:100%;border:0;border-radius:9px;color:white;background:var(--burg);padding:12px;font-weight:650;font-size:13px}.ny-acad-actions button+button,.outline{background:white!important;color:var(--burg)!important;border:1px solid #c09ca9!important}.ny-acard form{display:flex;flex-direction:column;gap:12px}.ny-acard form label{font-size:12px;font-weight:650;color:#745660}.ny-acard form input{min-height:47px;width:100%;padding:12px;border-radius:9px;border:1px solid #dcc3cc;color:#242124;background:white;font-size:14px}.ny-hint{font-size:11px!important;color:#a6929a!important;margin:11px 0 0!important}.error{min-height:17px;margin:0;color:#b32640;font-size:12px}.ny-acad-title{padding:30px 20px 10px}.ny-acad-title h1{font-size:33px;line-height:1.15;margin:10px 0 6px;color:var(--burg);letter-spacing:-1px}.ny-acad-title p{font-size:12px;margin:0;color:#8e6d78}.ny-acad-row{display:flex;align-items:center;justify-content:space-between;gap:15px;border:0;border-bottom:1px solid #efe3e7;background:transparent;width:100%;padding:17px 0;font-size:13px;font-weight:650;text-align:left;color:#4e3840}.ny-acad-row:last-child{border-bottom:0}.ny-acad-row span{font-size:10px;letter-spacing:-.1px;color:#a07181;font-weight:500;white-space:nowrap}.ny-plain{display:block;width:calc(100% - 32px);margin:14px 16px;background:#fff;border:1px solid #c5a1ac;color:var(--burg);border-radius:10px;min-height:46px;padding:11px}.ny-datarow{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #f1e6e9;font-size:12px;line-height:1.5}.ny-datarow span{color:#9a7a85}.ny-datarow b{color:#4b3540;text-align:right;font-weight:700;overflow-wrap:anywhere}.ny-splash{background:white;height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px}.ny-splash img{width:min(46vw,214px);height:min(46vw,214px);object-fit:contain}.ny-splash small{color:#b0929c;font-size:10px;letter-spacing:2px}.divider{height:1px;background:var(--border);margin:19px 0}.secure-symbol{height:60px;width:60px;border-radius:50%;background:#f7ecef;display:grid;place-items:center;color:var(--burg);font-size:33px;margin:10px auto 19px}.fineprint{margin:24px 20px 0;font-size:10px;line-height:1.8;color:#a28d94;text-align:center}.toast{position:fixed;z-index:40;left:50%;bottom:26px;transform:translate(-50%,15px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:#402631;color:white;padding:12px 17px;border-radius:12px;box-shadow:0 5px 20px #0003;font-size:12px;max-width:min(90%,440px);text-align:center}.toast.visible{opacity:1;transform:translate(-50%,0)}.detail-divider{margin:18px 0 2px;border-top:1px solid #eee1e5}.lock-icon{display:inline-block;font-size:16px;margin-right:5px}.quicknav{font-size:12px;color:#a17181;border:none;background:transparent;min-height:39px;padding:5px 0}.accessmark{display:inline-flex;gap:6px;align-items:center;color:#a17181;font-size:11px;padding:8px 10px;background:#f7eff1;border-radius:8px;margin-top:12px}.stamp{display:inline-block;padding:4px 7px;border:1px solid #ad8593;color:#926a77;font-size:9px;letter-spacing:1px;border-radius:3px}.screen-footer{font-size:10px;color:#98858d;text-align:center;padding:7px 20px 20px;line-height:1.8}.login-wrap{padding-top:28px}.view-toggle{background:none;border:0;color:var(--burg);padding:6px 1px;font-size:12px;text-align:right}.recordhead{padding:11px 0 13px;border-bottom:1px solid #e7d6dc;display:flex;justify-content:space-between;align-items:center;gap:12px}.recordhead img{width:45px;height:45px;object-fit:contain}.recordhead small{font-size:10px;line-height:1.8;color:#a07888;letter-spacing:.5px}.recordhead b{font-size:13px;color:var(--burg)}
@media(min-width:680px){.shell{padding:36px 20px 50px}.app{min-height:750px;border-radius:16px;overflow:hidden}#screen,.ny-acad,.ny-splash{min-height:750px}.ny-splash{height:750px}.toast{bottom:50px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
.ny-name-reveal{border:1px solid #c49eac;border-radius:7px;background:#faf4f7;color:#762d48;font-family:inherit;font-size:12px;font-weight:750;padding:6px 10px;min-height:30px;cursor:pointer;letter-spacing:1px}.ny-name-reveal span{font-size:15px;margin-left:4px;color:#762d48}.ny-name-reveal:focus-visible{outline:2px solid #762d48;outline-offset:3px} 

/* Mobile: seamless full-viewport content, no simulated top/bottom bezel or bands. */
@media(max-width:679px){
html,body{width:100%;min-height:100%;margin:0;padding:0;overscroll-behavior-y:none;background:#fff}
.shell{width:100%;min-height:100dvh;margin:0;padding:0;display:block}
.app{width:100%;max-width:none;min-height:100dvh;margin:0;border-radius:0;box-shadow:none}
.app::before{display:none}
#screen,.ny-acad{min-height:100dvh}
.ny-splash{min-height:100dvh;height:100dvh}
.ny-nav{padding-top:max(4px, env(safe-area-inset-top, 0px));height:calc(64px + env(safe-area-inset-top, 0px))}
.ny-acad{padding-bottom:max(38px,env(safe-area-inset-bottom, 0px))}
}
.ny-fullscreen-toggle{display:block;margin:12px auto 24px;padding:9px 16px;border:1px solid #dcc8cf;background:#fff;color:#7c394f;border-radius:20px;font-size:11px}
@media(display-mode:standalone),(display-mode:fullscreen){.ny-fullscreen-toggle{display:none}}
</style>

function staffGate(){return `<div class="ny-acad">${header('열람 권한 확인')}<section class="ny-acard" style="margin-top:36px;text-align:center;padding:38px 22px"><div class="secure-symbol">⌁</div><small>STAFF ACCESS REQUIRED</small><h3>관계자 전용 기록</h3><p>본 문서에는 가이딩 검사와 능력 운용 관리에 관한 학원 내부 정보가 포함되어 있습니다. 관계자 인증 후 열람할 수 있습니다.</p><button class="solid" data-a="stafflogin">관계자 로그인</button></section></div>`}

lines=[['문서 분류','관계자 추가 인증 / 제한 열람'],['기록 대상','능여'],['등록 기질','SENTINEL / X'],['관리 구분','인정학원 내부'],['접속 계정',adminUser||'미인증']];
paras=[['최초 연락 경위 관련 비공개 기록','대상자의 학원 입소 이전, 모친이 금전적 대가를 목적으로 대상자의 신상 및 기질 관련 정보를 학원 측에 제공한 경위가 확인되었다. 해당 정보 제공은 대상자 본인의 동의 없이 이루어진 것으로 기록된다. 구체적인 거래 금액이나 관계자 명단 등 확인되지 않은 사항은 기재하지 않는다.'],['대상자 인지 시점','대상자는 2026년 1월 학원 측의 최초 접촉 당시 정보가 전달된 경위를 알지 못했다. 해당 사실은 이후 대상자에게 알려졌다. 당시 모친과의 직접적인 연락은 단절된 상태였다.'],['입소 관련 특이 사항','2017년 기질 발현 이후 대상자는 학원 밖에서 생활하며 대학 진학 등 일반적인 사회생활을 지속했다. 부친은 기질 발현 사실을 알고 있었으나 대상자의 의사를 존중했다. 2026년 학원 측 연락을 계기로 입소 절차가 진행되었다.'],['권한 및 취급 안내','본 기록은 관계자 로그인 이후 별도의 문서 인증을 완료해야 열람된다. 검사·훈련 기록 열람 권한만으로는 자동 공개되지 않는다. 개인 신상 및 성장 배경 문서에도 동일한 추가 인증 절차가 적용된다.']];}

return `<div class="ny-acad">${header(titles[id])}<section class="ny-acard"><small>INJEONG ACADEMY / PERSONNEL RECORD</small>${lines.map(([k,v])=>`<div class="ny-datarow"><span>${E(k)}</span>${k==='본명'&&staff?'<button type="button" data-a="nameauth" class="ny-name-reveal" aria-label="마스킹 된 본명 확인 인증">□□□ <span aria-hidden="true">›</span></button>':`<b>${E(v)}</b>`}</div>`).join('')}${paras.map(([t,s])=>`<h3>${E(t)}</h3><p>${E(s)}</p>`).join('')}</section></div>`}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||!document.getElementById('app').contains(b))return;let d=b.dataset;
if(['login-submit','timeline-submit','name-submit','verify-submit'].includes(d.a)){
 e.preventDefault();return handleAuth(b.closest('[data-form]'));
}
if(d.a==='fullscreen'){
  e.preventDefault();
  if(document.fullscreenElement){document.exitFullscreen?.();return;}
  const req=document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
  if(req){Promise.resolve(req.call(document.documentElement,{navigationUI:'hide'})).catch(()=>toast('전체 화면을 지원하지 않는 브라우저입니다. 홈 화면에 설치해서 실행해 주세요.'));}
  else toast('홈 화면에 설치해서 실행하면 브라우저 메뉴가 사라집니다.');
  return;
}
if(d.a==='back')return back();if(d.a==='nameauth'){if(!staff)return;return nav('academy-name-auth')}if(d.a==='timelineauth')return nav('academy-timeline-auth');if(d.a==='privateauth'){if(!staff)return nav('academy-login');verifyTarget='history';return nav('academy-auth')}if(d.a==='adminauth'){verifyTarget='admin';return nav('academy-auth')}if(d.a==='stafflogin'&&page.startsWith('record:'))return nav('academy-login');if(d.a==='visitor')return guest();if(d.a==='stafflogin')return nav('academy-login');if(d.a==='acadlogout')return logout();if(d.rec){if(['medical','timeline','operational','training'].includes(d.rec)&&!(staff||timelineVerified)){timelineTarget=d.rec;return nav('academy-timeline-auth')}if(d.rec==='history'&&staff&&!verified){verifyTarget='history';return nav('academy-auth')}if(d.rec==='admin'&&staff&&!verified){verifyTarget='admin';return nav('academy-auth')}return nav('record:'+d.rec)}});
function handleAuth(form){
if(!form)return;
const type=form.dataset.form;
const get=name=>String(form.querySelector('[name="'+name+'"]')?.value||'');

const showErr=message=>{const el=form.querySelector('.error');if(el)el.textContent=message;};
if(type==='staff'){
 const id=get('id').normalize('NFKC').trim().replace(/\s+/g,'');
 const pass=get('password').normalize('NFKC').trim().replace(/\s+/g,'').toUpperCase();
 if(!id||!pass){showErr('별칭과 기질등급을 모두 입력해 주세요.');return;}
 if(Object.prototype.hasOwnProperty.call(relationshipCredentials,id)&&relationshipCredentials[id]===pass){
  staff=true;verified=false;timelineVerified=true;nameVerified=false;adminUser=id;
  stack=[];page='academy-list';render();return;
 }
 showErr('별칭 또는 기질등급이 일치하지 않습니다. 다시 입력해 주세요.');
 return;
}
if(type==='timeline'){
 const pin=get('pin').trim();
 if(!pin){showErr('인증번호를 입력해 주세요.');return;}
 if(pin==='031130'){
  timelineVerified=true;
  page='record:'+timelineTarget;render();return;
 }
 showErr('인증번호가 일치하지 않습니다.');return;
}
if(type==='name'){
 // Public static distribution: neither the real name nor its validation code is shipped.
 // This gateway is deliberately non-resolving; any entered value yields the same response.
 if(!staff){showErr('ERR-403 · 관계자 로그인이 필요합니다.');return;}
 const value=get('namepass').trim();
 if(!value){showErr('인증값을 입력해 주세요.');return;}
 showErr('ERR-503 · 인증 서버에 연결할 수 없습니다. 본명 원문은 현재 열람할 수 없습니다.');
 const field=form.querySelector('[name="namepass"]');
 if(field){field.value='';field.focus();}
 return;
}
if(type==='verify'){
 const pin=get('pin').trim();
 if(!pin){showErr('인증번호를 입력해 주세요.');return;}
 if(staff&&pin==='031130'){
  verified=true;
  page='record:'+verifyTarget;render();return;
 }
 showErr('관계자 권한 또는 인증번호를 확인해 주세요.');
}
}
document.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();handleAuth(form)});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&page!=='academy'&&page!=='splash')back()});
render();bootTimer=setTimeout(()=>{if(page==='splash'){page='academy';render()}},2000);
})();
</script>
<script>
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
